<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FitTally</title>
<meta name="description" content="FitTally — Terms of Service and Privacy Policy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#1C1F26;
    --paper:#F2F3EF;
    --surface:#FFFFFF;
    --accent:#2E6A80;
    --accent-soft:#D4E4E9;
    --line:#D8D9D2;
    --muted:#63665F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEEEA;
      --paper:#15171B;
      --surface:#1C1F24;
      --accent:#7FB6CB;
      --accent-soft:#1B2E34;
      --line:#2E3136;
      --muted:#9A9D95;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEEEA;
    --paper:#15171B;
    --surface:#1C1F24;
    --accent:#7FB6CB;
    --accent-soft:#1B2E34;
    --line:#2E3136;
    --muted:#9A9D95;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .wrap{ max-width:700px; margin:0 auto; padding:56px 24px 80px; text-align:center; }
  h1{
    font-family:"Fraunces", Georgia, serif; font-weight:600; font-optical-sizing:auto;
    font-size:clamp(2.2rem, 6vw, 3rem); line-height:1.08; letter-spacing:-0.01em;
    margin:0 0 32px; text-wrap:balance;
  }
  nav{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  nav a{
    display:inline-block; color:var(--accent); text-decoration:none;
    font-weight:600; padding:12px 20px; border:1.5px solid var(--line);
    border-radius:10px; background:var(--surface);
  }
  nav a:hover{ border-color:var(--accent); background:var(--accent-soft); }
</style>

<div class="wrap">
  <h1>FitTally</h1>
  <nav>
    <a href="/terms/">Terms of Service</a>
    <a href="/privacy/">Privacy Policy</a>
  </nav>
</div>

</body></html>
